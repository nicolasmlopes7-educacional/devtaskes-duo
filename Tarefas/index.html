<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTasks - Home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container header-content">
            <h1 class="logo">DevTasks</h1>

            <nav class="nav">
                <a href="index.html" class="active">Home</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="tasks">
            <div class="container task-panel">
                <h2>Tarefas</h2>

                <div class="task-form">
                    <label for="task-input">Nova tarefa:</label>
                    <input id="task-input" type="text" placeholder="Digite a tarefa">
                    <button type="button" class="button primary">Adicionar tarefa</button>
                </div>

                <div class="task-list-box">
                    <p>Minhas tarefas:</p>

                    <label class="task-item"><input type="checkbox"> Estudar Git</label>
                    <label class="task-item"><input type="checkbox"> Fazer exercício</label>
                    <label class="task-item"><input type="checkbox"> Revisar Pull Request</label>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>
                &copy; 2026 DevTasks. Projeto desenvolvido para fins educacionais.
            </p>
        </div>
    </footer>

</body>

</html>
